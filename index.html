<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资源平台</title>
    
    <!-- 1. 建立极其重要的 DNS 和 TCP 预连接 (加速海外 CDN 握手) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    
    <!-- 核心黑科技：利用 media="print" 欺骗浏览器，下载完再触发 onload 切换为屏幕样式 (font-display: swap) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" media="print" onload="this.media='all'">
    
    <!-- 针对禁用 JS 的极端环境兜底 -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    </noscript>

    <style>
      /* 强制回退字体，确保字体没下完时也能有字看，不白屏 */
      body { 
        margin: 0; padding: 0; 
        background-color: #fdfcff; 
        font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      }
    </style>
  </head>
  <body>
    <div id="app">
      
      <div style="display:flex; height:100vh; justify-content:center; align-items:center; flex-direction:column; gap:24px; color:#1a1c1e;">
        <div style="width: 48px; height: 48px; border: 4px solid #0061a4; border-bottom-color: transparent; border-radius: 50%; animation: initial-spin 1s linear infinite;"></div>
        <div style="font-size: 1.1rem; font-weight: bold; letter-spacing: 1px;">安全环境极速装载中...</div>
        <style>@keyframes initial-spin { 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <!-- 带有 defer/module 属性的脚本，本身就是异步加载的 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
